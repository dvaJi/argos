<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nebula — Interactive Flow Field</title>
<style>
  :root {
    --panel: rgba(10, 12, 24, 0.72);
    --border: rgba(255, 255, 255, 0.12);
    --text: rgba(255, 255, 255, 0.92);
    --muted: rgba(255, 255, 255, 0.45);
    --accent: #7dd3fc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060c; font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; color: var(--text); }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }

  /* Top-left title */
  #title {
    position: fixed; top: 18px; left: 22px; pointer-events: none; user-select: none;
    letter-spacing: 0.08em;
  }
  #title h1 {
    font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.35em; color: rgba(255,255,255,0.85);
    text-shadow: 0 0 24px rgba(125,211,252,0.5);
  }
  #title p { margin-top: 5px; font-size: 11px; color: var(--muted); letter-spacing: 0.05em; }

  /* Control panel */
  #panel {
    position: fixed; left: 22px; bottom: 22px; width: 300px; pointer-events: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 16px 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.45); user-select: none;
  }
  #panel h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted); margin-bottom: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 9px 0; }
  .row label { font-size: 12px; color: rgba(255,255,255,0.78); white-space: nowrap; }
  .row output { font-size: 11px; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
  input[type="range"] { -webkit-appearance: none; appearance: none; flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.16); outline: none; }
  input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 10px rgba(125,211,252,0.7); }
  input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border: none; border-radius: 50%; background: var(--accent); cursor: pointer; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
  .chip {
    border: 1px solid var(--border); background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.8);
    font-size: 11px; padding: 4px 10px; border-radius: 999px; cursor: pointer; transition: all .15s ease;
  }
  .chip:hover { border-color: rgba(125,211,252,0.6); }
  .chip.active { background: var(--accent); color: #04101c; border-color: var(--accent); font-weight: 600; }
  #fps { position: fixed; top: 18px; right: 22px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; text-align: right; line-height: 1.7; }
  #fps b { color: var(--accent); font-weight: 600; }
  .hint { font-size: 10px; color: rgba(255,255,255,0.35); margin-top: 10px; letter-spacing: 0.03em; }
  .pause-veil { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .25s ease; background: rgba(3,4,10,0.35); display: flex; align-items: center; justify-content: center; }
  .pause-veil.show { opacity: 1; }
  .pause-veil span { font-size: 12px; letter-spacing: 0.5em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title">
  <h1>✦ Nebula</h1>
  <p>interactive flow field — move your cursor</p>
</div>

<div id="fps"><b id="fpsVal">--</b> fps<br /><span id="pcount">--</span> particles</div>

<div id="panel">
  <h2>Controls</h2>
  <div class="row"><label>Particles</label><input type="range" id="count" min="300" max="5000" step="100" value="2200" /><output id="countOut">2200</output></div>
  <div class="row"><label>Speed</label><input type="range" id="speed" min="0.2" max="3" step="0.1" value="1.1" /><output id="speedOut">1.1×</output></div>
  <div class="row"><label>Turbulence</label><input type="range" id="turb" min="0.2" max="3" step="0.1" value="1.4" /><output id="turbOut">1.4×</output></div>
  <div class="row"><label>Cursor mode</label></div>
  <div class="chips" id="mouseChips">
    <button class="chip active" data-mode="attract">Attract</button>
    <button class="chip" data-mode="repel">Repel</button>
    <button class="chip" data-mode="swirl">Swirl</button>
    <button class="chip" data-mode="off">Off</button>
  </div>
  <div class="row"><label>Theme</label></div>
  <div class="chips" id="themeChips">
    <button class="chip active" data-theme="nebula">Nebula</button>
    <button class="chip" data-theme="aurora">Aurora</button>
    <button class="chip" data-theme="ember">Ember</button>
    <button class="chip" data-theme="mono">Mono</button>
  </div>
  <div class="hint">space pause · r reset · move cursor to sculpt the field</div>
</div>

<div class="pause-veil" id="veil"><span>Paused</span></div>

<script>
"use strict";
/* ============================ Perlin noise ============================ */
const PERM = new Uint8Array(512);
(function () {
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
function lerp(a, b, t) { return a + (b - a) * t; }
function grad(h, x, y) {
  switch (h & 7) {
    case 0: return  x + y; case 1: return -x + y;
    case 2: return  x - y; case 3: return -x - y;
    case 4: return  x;     case 5: return -x;
    case 6: return  y;     default: return -y;
  }
}
function noise2(x, y) {
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
  x -= Math.floor(x); y -= Math.floor(y);
  const u = fade(x), v = fade(y);
  const A = PERM[X] + Y, B = PERM[X + 1] + Y;
  return lerp(
    lerp(grad(PERM[A], x, y), grad(PERM[B], x - 1, y), u),
    lerp(grad(PERM[A + 1], x, y - 1), grad(PERM[B + 1], x - 1, y - 1), u),
    v
  );
}
/* fbm: layered noise, [-1, 1] */
function fbm(x, y, octaves) {
  let sum = 0, amp = 1, freq = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += amp * noise2(x * freq, y * freq);
    norm += amp; amp *= 0.5; freq *= 2;
  }
  return sum / norm;
}

/* ============================ Themes ============================ */
const THEMES = {
  nebula: { hue: [200, 290], sat: [70, 90], light: [55, 70], bg: [8, 8, 18] },
  aurora: { hue: [130, 190], sat: [75, 95], light: [50, 68], bg: [4, 12, 16] },
  ember:  { hue: [0, 45],    sat: [85, 100], light: [50, 65], bg: [12, 6, 8] },
  mono:   { hue: [215, 220], sat: [0, 6],    light: [55, 80], bg: [7, 8, 12] },
};
let theme = "nebula";

/* ============================ Canvas ============================ */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = "source-over";
}
window.addEventListener("resize", resize);
resize();

/* ============================ Particles ============================ */
const MAX = 5000;
let particles = [];
function initParticles(n) {
  particles = new Array(n);
  for (let i = 0; i < n; i++) {
    particles[i] = {
      x: Math.random() * W, y: Math.random() * H,
      vx: 0, vy: 0,
      hue: 0, sat: 0, light: 0, size: 0,
      life: 0,
    };
  }
}
function respawn(p, n) {
  p.x = Math.random() * W; p.y = Math.random() * H;
  p.vx = 0; p.vy = 0;
  assignColor(p, n);
}
function assignColor(p, n) {
  const t = THEMES[theme];
  const a = Math.random() * 0.5 + 0.5; // slight per-particle variance
  p.hue = t.hue[0] + Math.random() * (t.hue[1] - t.hue[0]);
  p.sat = (t.sat[0] + Math.random() * (t.sat[1] - t.sat[0])) * a;
  p.light = t.light[0] + Math.random() * (t.light[1] - t.light[0]);
  p.size = 0.7 + Math.random() * 1.1;
  p.life = n;
}

let particleCount = 2200;
initParticles(particleCount);

/* ============================ Mouse ============================ */
const mouse = { x: -9999, y: -9999, active: false };
let mouseMode = "attract";
window.addEventListener("pointermove", (e) => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
window.addEventListener("pointerdown", (e) => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
});
window.addEventListener("pointerleave", () => { mouse.active = false; });

/* ============================ Sim ============================ */
let paused = false;
let time = 0;
const BG_ALPHA = 0.16;

function step(dt) {
  const speed = parseFloat(document.getElementById("speed").value);
  const turb = parseFloat(document.getElementById("turb").value);
  const scale = 0.0032;
  const strength = 2.6 * speed * turb;
  const n = particles.length;

  for (let i = 0; i < n; i++) {
    const p = particles[i];
    // flow field angle from fbm noise
    const nx = p.x * scale, ny = p.y * scale;
    const a = fbm(nx + time, ny - time, 3) * Math.PI * 2;
    let fx = Math.cos(a) * strength;
    let fy = Math.sin(a) * strength;

    // cursor interaction
    if (mouse.active && mouseMode !== "off") {
      const dx = mouse.x - p.x, dy = mouse.y - p.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 1) { respawn(p, n); continue; }
      const d = Math.sqrt(d2);
      const falloff = Math.min(1, 260 / d);
      const f = falloff * falloff * 900;
      if (mouseMode === "repel") { fx -= (dx / d) * f; fy -= (dy / d) * f; }
      else if (mouseMode === "swirl") {
        // tangential vortex
        fx += (-dy / d) * f * 0.8; fy += (dx / d) * f * 0.8;
      } else { // attract
        fx += (dx / d) * f; fy += (dy / d) * f;
        // subtle swirl on top for life
        fx += (-dy / d) * f * 0.35; fy += (dx / d) * f * 0.35;
      }
    }

    p.vx += (fx - p.vx) * 0.06 * speed;
    p.vy += (fy - p.vy) * 0.06 * speed;
    p.x += p.vx * dt * 60;
    p.y += p.vy * dt * 60;

    // wrap edges
    if (p.x < -4) p.x = W + 4; else if (p.x > W + 4) p.x = -4;
    if (p.y < -4) p.y = H + 4; else if (p.y > H + 4) p.y = -4;
  }
}

function draw() {
  const t = THEMES[theme];
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = `rgba(${t.bg[0]},${t.bg[1]},${t.bg[2]},${BG_ALPHA})`;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = "lighter";
  const n = particles.length;
  for (let i = 0; i < n; i++) {
    const p = particles[i];
    ctx.fillStyle = `hsla(${p.hue},${p.sat}%,${p.light}%,0.75)`;
    const s = p.size;
    ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
  }
}

/* ============================ Loop ============================ */
let last = performance.now();
let fpsFrames = 0, fpsTime = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (!paused) {
    time += dt * 0.06;
    step(dt);
    draw();
  }

  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 0.5) {
    document.getElementById("fpsVal").textContent = Math.round(fpsFrames / fpsTime);
    fpsFrames = 0; fpsTime = 0;
  }
}
requestAnimationFrame(loop);

/* ============================ UI wiring ============================ */
function setCount(n) {
  particleCount = n;
  if (particles.length > n) particles.length = n;
  else {
    const old = particles.length;
    for (let i = old; i < n; i++) {
      const p = { x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0, hue: 0, sat: 0, light: 0, size: 1, life: 0 };
      assignColor(p, n);
      particles.push(p);
    }
  }
  document.getElementById("pcount").textContent = particles.length.toLocaleString();
}
function setTheme(name) {
  theme = name;
  for (const p of particles) assignColor(p, particles.length);
  // repaint background fully for a clean switch
  const t = THEMES[name];
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = `rgb(${t.bg[0]},${t.bg[1]},${t.bg[2]})`;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgb(${t.bg[0]},${t.bg[1]},${t.bg[2]})`;
  ctx.fillRect(0, 0, W, H);
}
function setMode(m) { mouseMode = m; }

const countEl = document.getElementById("count"), countOut = document.getElementById("countOut");
countEl.addEventListener("input", () => { countOut.textContent = countEl.value; setCount(+countEl.value); });
const speedEl = document.getElementById("speed"), speedOut = document.getElementById("speedOut");
speedEl.addEventListener("input", () => { speedOut.textContent = (+speedEl.value).toFixed(1) + "×"; });
const turbEl = document.getElementById("turb"), turbOut = document.getElementById("turbOut");
turbEl.addEventListener("input", () => { turbOut.textContent = (+turbEl.value).toFixed(1) + "×"; });

document.getElementById("mouseChips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  document.querySelectorAll("#mouseChips .chip").forEach(c => c.classList.remove("active"));
  b.classList.add("active"); setMode(b.dataset.mode);
});
document.getElementById("themeChips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  document.querySelectorAll("#themeChips .chip").forEach(c => c.classList.remove("active"));
  b.classList.add("active"); setTheme(b.dataset.theme);
});

function togglePause() {
  paused = !paused;
  document.getElementById("veil").classList.toggle("show", paused);
  if (paused) { // solid background while paused so trails don't accumulate
    const t = THEMES[theme];
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgb(${t.bg[0]},${t.bg[1]},${t.bg[2]})`;
    ctx.fillRect(0, 0, W, H);
  }
}
function resetField() {
  initParticles(particles.length);
  const t = THEMES[theme];
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = `rgb(${t.bg[0]},${t.bg[1]},${t.bg[2]})`;
  ctx.fillRect(0, 0, W, H);
  document.getElementById("pcount").textContent = particles.length.toLocaleString();
}
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); togglePause(); }
  else if (e.key === "r" || e.key === "R") resetField();
  else if (e.key === "1") { document.querySelector('[data-theme="nebula"]').click(); }
  else if (e.key === "2") { document.querySelector('[data-theme="aurora"]').click(); }
  else if (e.key === "3") { document.querySelector('[data-theme="ember"]').click(); }
  else if (e.key === "4") { document.querySelector('[data-theme="mono"]').click(); }
});

document.getElementById("pcount").textContent = particles.length.toLocaleString();
</script>
</body>
</html>
