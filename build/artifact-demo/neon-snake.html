<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NEON SNAKE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04050c; font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; color: #eaf6ff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; user-select: none; pointer-events: none;
  }
  .card {
    background: rgba(8, 10, 22, 0.82); border: 1px solid rgba(120, 220, 255, 0.22);
    border-radius: 20px; padding: 40px 56px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 0 60px rgba(34, 211, 238, 0.18), inset 0 0 40px rgba(34, 211, 238, 0.05);
  }
  h1 {
    font-size: 44px; font-weight: 800; letter-spacing: 0.28em; text-transform: uppercase;
    background: linear-gradient(90deg, #22d3ee, #a78bfa, #f472b6, #22d3ee);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 6s linear infinite; text-indent: 0.28em;
  }
  @keyframes shine { to { background-position: 300% 0; } }
  .sub { margin-top: 10px; color: rgba(234, 246, 255, 0.55); font-size: 14px; letter-spacing: 0.12em; }
  .keys { margin-top: 26px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  kbd {
    font-family: inherit; font-size: 12px; letter-spacing: 0.08em; color: #cfefff;
    border: 1px solid rgba(140, 220, 255, 0.35); background: rgba(140, 220, 255, 0.08);
    padding: 7px 12px; border-radius: 8px; box-shadow: 0 2px 0 rgba(0,0,0,0.4);
  }
  .big { margin-top: 30px; font-size: 15px; letter-spacing: 0.18em; color: #67e8f9; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  .hidden { display: none !important; }
  #hud { position: fixed; top: 18px; left: 22px; right: 22px; display: flex; justify-content: space-between; pointer-events: none; user-select: none; }
  #hud span { font-size: 14px; letter-spacing: 0.14em; font-variant-numeric: tabular-nums; }
  #hud .score b { color: #67e8f9; font-size: 20px; }
  #hud .best b { color: #c4b5fd; font-size: 20px; }
  #hud .hint { color: rgba(234,246,255,0.35); font-size: 11px; align-self: center; }
  #gameOver .card { border-color: rgba(244, 114, 182, 0.35); box-shadow: 0 0 60px rgba(244, 114, 182, 0.15); }
  #gameOver h2 { font-size: 32px; font-weight: 800; letter-spacing: 0.24em; color: #f9a8d4; text-transform: uppercase; text-indent: 0.24em; }
  #gameOver .final { margin-top: 14px; font-size: 16px; color: rgba(234,246,255,0.8); }
  #gameOver .final b { color: #67e8f9; font-size: 22px; }
  .newbest { margin-top: 8px; font-size: 12px; letter-spacing: 0.2em; color: #fbbf24; }
  #pauseTag { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 15px; letter-spacing: 0.6em; text-transform: uppercase; color: rgba(234,246,255,0.6); text-indent: 0.6em; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <span class="score">SCORE <b id="scoreVal">0</b></span>
  <span class="hint">P = pause · R = restart</span>
  <span class="best">BEST <b id="bestVal">0</b></span>
</div>

<div id="startScreen" class="overlay">
  <div class="card">
    <h1>Neon Snake</h1>
    <div class="sub">grow · glow · don't bite yourself</div>
    <div class="keys"><kbd>↑ ↓ ← →</kbd><kbd>W A S D</kbd><kbd>P pause</kbd><kbd>R restart</kbd></div>
    <div class="big">PRESS SPACE TO START</div>
  </div>
</div>

<div id="gameOver" class="overlay hidden">
  <div class="card">
    <h2>Game Over</h2>
    <div class="final">SCORE <b id="finalScore">0</b></div>
    <div class="newbest hidden" id="newBestTag">★ NEW BEST ★</div>
    <div class="big">PRESS SPACE TO RETRY</div>
  </div>
</div>

<div id="pauseTag" class="hidden">Paused</div>

<script>
"use strict";
/* ============================ Canvas ============================ */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  rebuildGrid();
}
window.addEventListener("resize", resize);

/* ============================ Grid ============================ */
let CELL = 0, COLS = 0, ROWS = 0;
function rebuildGrid() {
  CELL = Math.max(14, Math.min(36, Math.floor(Math.min(W, H) / 22)));
  COLS = Math.max(10, Math.floor(W / CELL));
  ROWS = Math.max(10, Math.floor(H / CELL));
  // keep snake inside if it somehow exceeds (resize mid-game)
  for (const s of snake) { s.x = Math.min(s.x, COLS - 1); s.y = Math.min(s.y, ROWS - 1); }
  if (food.x >= COLS || food.y >= ROWS) placeFood();
}
const OX = 0, OY = 0; // grid drawn from top-left

/* ============================ State ============================ */
const KEY = "neon-snake-best";
let state = "start"; // start | playing | paused | dead
let snake = [], dir = { x: 1, y: 0 }, queue = [];
let food = { x: 0, y: 0 };
let score = 0, best = parseInt(localStorage.getItem(KEY) || "0", 10) || 0;
let moveAcc = 0, moveEvery = 140;
let particles = [];
let shake = 0;
let hueBase = 180;

document.getElementById("bestVal").textContent = best;

function spawnSnake() {
  const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
  snake = [
    { x: cx, y: cy },
    { x: cx - 1, y: cy },
    { x: cx - 2, y: cy },
  ];
  dir = { x: 1, y: 0 };
  queue = [];
}
function placeFood() {
  if (snake.length >= COLS * ROWS) return false;
  let x, y, tries = 0;
  do {
    x = (Math.random() * COLS) | 0;
    y = (Math.random() * ROWS) | 0;
    tries++;
  } while (tries < 500 && snake.some(s => s.x === x && s.y === y));
  food = { x, y };
  return true;
}
function startGame() {
  score = 0; moveAcc = 0; moveEvery = 140; particles = []; shake = 0;
  spawnSnake();
  placeFood();
  state = "playing";
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameOver").classList.add("hidden");
  document.getElementById("hud").classList.remove("hidden");
  document.getElementById("scoreVal").textContent = 0;
  paintBackground(true);
}
function gameOver() {
  state = "dead";
  shake = 18;
  // burst particles along the body
  for (const s of snake) {
    for (let i = 0; i < 3; i++) {
      particles.push(mkParticle(s.x * CELL + CELL / 2, s.y * CELL + CELL / 2, 300, 90, 75, 65));
    }
  }
  const isBest = score > best;
  if (isBest) {
    best = score;
    localStorage.setItem(KEY, String(best));
    document.getElementById("bestVal").textContent = best;
  }
  document.getElementById("finalScore").textContent = score;
  document.getElementById("newBestTag").classList.toggle("hidden", !isBest);
  setTimeout(() => {
    if (state === "dead") {
      document.getElementById("gameOver").classList.remove("hidden");
    }
  }, 600);
}

/* ============================ Particles ============================ */
function mkParticle(x, y, speed, hue, sat, light) {
  const a = Math.random() * Math.PI * 2;
  const v = speed * (0.4 + Math.random() * 0.8);
  return {
    x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
    hue: hue + (Math.random() * 40 - 20), sat, light,
    life: 1, decay: 0.9 + Math.random() * 0.5,
  };
}
function burst(x, y, color) {
  for (let i = 0; i < 26; i++) particles.push(mkParticle(x, y, 260, color, 90, 65));
}

/* ============================ Update ============================ */
function step() {
  // apply queued direction
  while (queue.length) {
    const d = queue.shift();
    if (d.x !== -dir.x || d.y !== -dir.y) { dir = d; break; }
  }
  const head = snake[0];
  const nx = head.x + dir.x, ny = head.y + dir.y;

  // wall collision
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) { gameOver(); return; }
  // self collision (ignore tail cell if it will move away)
  const willGrow = nx === food.x && ny === food.y;
  const body = willGrow ? snake : snake.slice(0, -1);
  if (body.some(s => s.x === nx && s.y === ny)) { gameOver(); return; }

  snake.unshift({ x: nx, y: ny });
  if (willGrow) {
    score++;
    document.getElementById("scoreVal").textContent = score;
    moveEvery = Math.max(62, 140 - score * 2);
    burst(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, hueBase + 60);
    if (!placeFood()) { // board full — you win
      state = "dead";
      document.getElementById("finalScore").textContent = score;
      document.getElementById("gameOver").querySelector("h2").textContent = "You Win!";
      document.getElementById("gameOver").classList.remove("hidden");
      return;
    }
  } else {
    snake.pop();
  }
}

/* ============================ Draw ============================ */
function paintBackground(clear) {
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#04050c";
  ctx.fillRect(0, 0, W, H);
  if (clear) return;
  // faint vignette
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.75);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,0.55)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawGrid() {
  ctx.globalCompositeOperation = "source-over";
  ctx.strokeStyle = "rgba(120, 200, 255, 0.045)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 1; x < COLS; x++) { ctx.moveTo(x * CELL + 0.5, 0); ctx.lineTo(x * CELL + 0.5, H); }
  for (let y = 1; y < ROWS; y++) { ctx.moveTo(0, y * CELL + 0.5); ctx.lineTo(W, y * CELL + 0.5); }
  ctx.stroke();
}

function drawFood(t) {
  const px = food.x * CELL + CELL / 2, py = food.y * CELL + CELL / 2;
  const pulse = 0.7 + 0.3 * Math.sin(t * 0.006);
  const r = CELL * 0.32 * pulse;
  ctx.globalCompositeOperation = "lighter";
  // glow
  const g = ctx.createRadialGradient(px, py, 0, px, py, r * 3);
  g.addColorStop(0, "rgba(248, 113, 113, 0.85)");
  g.addColorStop(0.4, "rgba(248, 113, 113, 0.35)");
  g.addColorStop(1, "rgba(248, 113, 113, 0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(px, py, r * 3, 0, Math.PI * 2); ctx.fill();
  // core
  ctx.fillStyle = "#fecaca";
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
}

function drawSnake() {
  ctx.globalCompositeOperation = "lighter";
  const n = snake.length;
  // outer soft pass
  for (let i = n - 1; i >= 0; i--) {
    const s = snake[i];
    const hue = hueBase + i * 3;
    ctx.fillStyle = `hsla(${hue}, 95%, 60%, 0.14)`;
    const pad = CELL * 0.22;
    ctx.fillRect(s.x * CELL + pad - 2, s.y * CELL + pad - 2, CELL - pad * 2 + 4, CELL - pad * 2 + 4);
  }
  // bright body pass
  for (let i = n - 1; i >= 0; i--) {
    const s = snake[i];
    const hue = hueBase + i * 3;
    const t = i / Math.max(1, n - 1);
    ctx.fillStyle = `hsla(${hue}, 100%, ${62 - t * 14}%, 0.95)`;
    const pad = CELL * 0.18;
    ctx.fillRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
  }
  // head: brighter + eyes
  const head = snake[0];
  const hx = head.x * CELL + CELL / 2, hy = head.y * CELL + CELL / 2;
  ctx.fillStyle = "hsla(" + hueBase + ", 100%, 72%, 1)";
  ctx.beginPath(); ctx.arc(hx, hy, CELL * 0.42, 0, Math.PI * 2); ctx.fill();
  // eyes
  const ex = dir.x, ey = dir.y;
  const px = -ey, py = ex; // perpendicular
  ctx.fillStyle = "#04101c";
  const er = CELL * 0.09, eo = CELL * 0.16, ef = CELL * 0.12;
  ctx.beginPath();
  ctx.arc(hx + ex * ef + px * eo, hy + ey * ef + py * eo, er, 0, Math.PI * 2);
  ctx.arc(hx + ex * ef - px * eo, hy + ey * ef - py * eo, er, 0, Math.PI * 2);
  ctx.fill();
}

function drawParticles(dt) {
  ctx.globalCompositeOperation = "lighter";
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.985; p.vy *= 0.985;
    p.life -= p.decay * dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${Math.min(1, p.life) * 0.8})`;
    ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
  }
}

/* ============================ Loop ============================ */
let last = performance.now();
let tGlobal = 0;
function loop(now) {
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);
  tGlobal += dt * 1000;

  if (state === "playing") {
    moveAcc += dt * 1000;
    while (moveAcc >= moveEvery) {
      moveAcc -= moveEvery;
      step();
      if (state !== "playing") break;
    }
  }
  drawParticles(dt);

  paintBackground(false);
  drawGrid();
  if (state !== "start") drawFood(tGlobal);
  if (state === "playing" || state === "paused" || state === "dead") drawSnake();

  // screen shake on death
  if (shake > 0) {
    ctx.save();
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    shake *= 0.86;
    if (shake < 0.5) shake = 0;
  }
  // red flash on death
  if (state === "dead") {
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(248, 60, 90, ${0.08 + Math.random() * 0.05})`;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}
requestAnimationFrame(loop);

/* ============================ Input ============================ */
const DIRS = {
  ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
  w: { x: 0, y: -1 }, s: { x: 0, y: 1 },
  a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
};
window.addEventListener("keydown", (e) => {
  const k = e.key;
  if (k === " " || k === "Spacebar") {
    e.preventDefault();
    if (state === "start" || state === "dead") startGame();
    else if (state === "playing") { state = "paused"; document.getElementById("pauseTag").classList.remove("hidden"); }
    else if (state === "paused") { state = "playing"; document.getElementById("pauseTag").classList.add("hidden"); }
    return;
  }
  if (k === "p" || k === "P" || k === "Escape") {
    if (state === "playing") { state = "paused"; document.getElementById("pauseTag").classList.remove("hidden"); }
    else if (state === "paused") { state = "playing"; document.getElementById("pauseTag").classList.add("hidden"); }
    return;
  }
  if (k === "r" || k === "R") { if (state !== "start") startGame(); return; }
  const d = DIRS[k] || DIRS[k.toLowerCase()];
  if (d) {
    e.preventDefault();
    if (state !== "playing") return;
    const lastDir = queue.length ? queue[queue.length - 1] : dir;
    if (d.x !== -lastDir.x || d.y !== -lastDir.y) {
      if (queue.length < 3) queue.push(d);
    }
  }
});

/* ============================ Boot ============================ */
resize();
spawnSnake();
placeFood();
paintBackground(true);
</script>
</body>
</html>
