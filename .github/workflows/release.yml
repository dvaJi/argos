name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.5 v0.5.6-beta.1)'
        required: true
        type: string
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RTK_INSTALL_GITHUB_TOKEN: ${{ secrets.RTK_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
  RTK_INSTALL_GITHUB_TOKEN_SOURCE: ${{ secrets.RTK_GITHUB_TOKEN != '' && 'RTK_GITHUB_TOKEN' || 'GITHUB_TOKEN' }}
  TURBO_API: ${{ secrets.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve tag
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            const isDispatch = context.eventName === 'workflow_dispatch'
            const tag = isDispatch
              ? context.payload.inputs?.tag
              : context.ref.replace('refs/tags/', '')
            if (!tag) {
              core.setFailed('Tag is required')
              return
            }

            const owner = context.repo.owner
            const repo = context.repo.repo
            const refName = `tags/${tag}`

            const resolveTagSha = async (refData) => {
              let sha = refData.object.sha
              if (refData.object.type === 'tag') {
                const tagObj = await github.rest.git.getTag({
                  owner,
                  repo,
                  tag_sha: sha
                })
                sha = tagObj.data.object.sha
              }
              return sha
            }

            if (isDispatch) {
              try {
                const { data } = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: refName
                })
                const sha = await resolveTagSha(data)
                core.setOutput('sha', sha)
              } catch (error) {
                const sha = context.sha
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/${refName}`,
                  sha
                })
                core.setOutput('sha', sha)
              }
            } else {
              try {
                const { data } = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: refName
                })
                const sha = await resolveTagSha(data)
                core.setOutput('sha', sha)
              } catch (error) {
                core.setFailed(`Tag ${tag} not found`)
                return
              }
            }

            core.setOutput('tag', tag)

  validate-main-ancestor:
    needs: resolve-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-tag.outputs.sha }}
          fetch-depth: 0

      - name: Validate tagged commit is reachable from master
        env:
          RELEASE_SHA: ${{ needs.resolve-tag.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          git fetch origin master --prune
          if ! git merge-base --is-ancestor "${RELEASE_SHA}" origin/master; then
            echo "Release tags must point to commits already reachable from origin/master." >&2
            exit 1
          fi

  preflight:
    needs: [resolve-tag, validate-main-ancestor]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-tag.outputs.sha }}
          fetch-depth: 1

      - uses: ./.github/actions/setup-build

      - name: Build and validate packaging inputs
        run: |
          bun run build
          bun run packaging:validate
        env:
          VITE_GITHUB_CLIENT_ID: ${{ secrets.ARGOS_GITHUB_CLIENT_ID }}
          VITE_GITHUB_REDIRECT_URI: ${{ secrets.ARGOS_GITHUB_REDIRECT_URI }}
          VITE_PROVIDER_DB_URL: ${{ secrets.CDN_PROVIDER_DB_URL }}

  build-windows:
    name: build-windows(${{ matrix.arch }})
    needs: [resolve-tag, preflight]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            platform: win-x64
            runner: windows-2025-vs2026
            unpacked: win-unpacked
            daemon_os: windows
          - arch: arm64
            platform: win-arm64
            runner: windows-11-arm
            unpacked: win-arm64-unpacked
            daemon_os: windows
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-tag.outputs.sha }}
          fetch-depth: 1

      - uses: ./.github/actions/setup-build
      - name: Restore Windows runtime cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: runtime
          key: runtime-v2-win32-${{ matrix.arch }}-${{ hashFiles('package.json', 'scripts/**') }}

      - name: Report RTK install token source
        shell: bash
        run: |
          echo "RTK runtime install token source: ${RTK_INSTALL_GITHUB_TOKEN_SOURCE}"

      - name: Install Node Runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: bun run installRuntime:win:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ env.RTK_INSTALL_GITHUB_TOKEN }}

      - name: Inspect Windows build toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node --version
          bun --version
          bun x turbo --version
          bun --version

      - name: Build Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun run build
          bun run packaging:validate
          bun run build:daemon
          bun run plugin:cua:build:win:${{ matrix.arch }}
          bun run plugin:bundle -- --name cua --platform win32 --arch ${{ matrix.arch }}
          bun x electron-builder --config apps/desktop/electron-builder.yml --win --${{ matrix.arch }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.ARGOS_GITHUB_CLIENT_ID }}
          VITE_GITHUB_REDIRECT_URI: ${{ secrets.ARGOS_GITHUB_REDIRECT_URI }}
          VITE_PROVIDER_DB_URL: ${{ secrets.CDN_PROVIDER_DB_URL }}
          ARGOS_TARGET_OS: win32
          ARGOS_TARGET_ARCH: ${{ matrix.arch }}

      - name: Verify bundled plugins
        shell: pwsh
        run: bun run plugin:verify -- --name cua --platform win32 --arch ${{ matrix.arch }} --plugin-root "dist/${{ matrix.unpacked }}/resources/app.asar.unpacked/plugins"

      - name: Stage daemon binary
        shell: bash
        env:
          DAEMON_OS: ${{ matrix.daemon_os }}
          DAEMON_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/daemon
          ext=""
          [ "$DAEMON_OS" = "windows" ] && ext=".exe"
          cp "apps/daemon/dist/argos-daemon${ext}" "dist/daemon/argos-daemon-${DAEMON_OS}-${DAEMON_ARCH}${ext}"

      - name: Verify daemon version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & "apps/daemon/dist/argos-daemon.exe" --version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Daemon did not report a version." }
          Write-Host "Daemon version: $version"

      - name: Verify remote-machine lifecycle
        run: bun run e2e:remote-machine

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: argos-${{ matrix.platform }}
          retention-days: 7
          path: |
            dist/*
            !dist/win-unpacked
            !dist/win-arm64-unpacked
            dist/daemon/**

  build-linux:
    needs: [resolve-tag, preflight]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [x64]
        include:
          - arch: x64
            platform: linux-x64
            daemon_os: linux
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-tag.outputs.sha }}
          fetch-depth: 1

      - uses: ./.github/actions/setup-build
      - name: Restore Linux runtime cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: runtime
          key: runtime-v2-linux-${{ matrix.arch }}-${{ hashFiles('package.json', 'scripts/**') }}

      - name: Install Linux runtimes
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: bun run installRuntime:linux:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ env.RTK_INSTALL_GITHUB_TOKEN }}

      - name: Build Linux
        run: |
          bun run build
          bun run build:daemon
          bun run plugin:cua:build:linux:${{ matrix.arch }}
          bun run plugin:bundle -- --name cua --platform linux --arch ${{ matrix.arch }}
          bun x electron-builder --config apps/desktop/electron-builder.yml --linux --${{ matrix.arch }} --publish=never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.ARGOS_GITHUB_CLIENT_ID }}
          VITE_GITHUB_REDIRECT_URI: ${{ secrets.ARGOS_GITHUB_REDIRECT_URI }}
          VITE_PROVIDER_DB_URL: ${{ secrets.CDN_PROVIDER_DB_URL }}
          ARGOS_TARGET_OS: linux
          ARGOS_TARGET_ARCH: ${{ matrix.arch }}

      - name: Verify bundled plugins
        run: bun run plugin:verify -- --name cua --platform linux --arch ${{ matrix.arch }} --plugin-root "dist/linux-unpacked/resources/app.asar.unpacked/plugins"

      - name: Stage daemon binary
        shell: bash
        env:
          DAEMON_OS: ${{ matrix.daemon_os }}
          DAEMON_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/daemon
          ext=""
          [ "$DAEMON_OS" = "windows" ] && ext=".exe"
          cp "apps/daemon/dist/argos-daemon${ext}" "dist/daemon/argos-daemon-${DAEMON_OS}-${DAEMON_ARCH}${ext}"

      - name: Verify daemon version
        shell: bash
        run: |
          version="$(apps/daemon/dist/argos-daemon --version)"
          test -n "$version"
          echo "Daemon version: $version"

      - name: Verify remote-machine lifecycle
        run: bun run e2e:remote-machine

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: argos-${{ matrix.platform }}
          retention-days: 7
          path: |
            dist/*
            !dist/linux-unpacked
            dist/daemon/**

  build-mac:
    needs: [resolve-tag, preflight]
    runs-on: macos-15
    strategy:
      matrix:
        arch: [arm64]
        include:
          - arch: arm64
            platform: mac-arm64
            daemon_os: darwin
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-tag.outputs.sha }}
          fetch-depth: 1

      - uses: ./.github/actions/setup-build
      - name: Restore macOS runtime cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: runtime
          key: runtime-v2-darwin-${{ matrix.arch }}-${{ hashFiles('package.json', 'scripts/**') }}

      - name: Report RTK install token source
        shell: bash
        run: |
          echo "RTK runtime install token source: ${RTK_INSTALL_GITHUB_TOKEN_SOURCE}"

      - name: Install Node Runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: bun run installRuntime:mac:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ env.RTK_INSTALL_GITHUB_TOKEN }}

      - name: Build Mac
        run: |
          bun run build
          bun run build:daemon
          bun run plugin:cua:build:mac:${{ matrix.arch }}
          bun run plugin:bundle -- --name cua --platform darwin --arch ${{ matrix.arch }}
          bun x electron-builder --config apps/desktop/electron-builder.yml --mac --${{ matrix.arch }} --publish=never
        env:
          # Unsigned CI build: ad-hoc signed (arm64) so it runs on Apple Silicon.
          # No CSC_LINK / notarization: notarize.js early-returns without
          # build_for_release, and the CUA helper falls back to ad-hoc signing.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GITHUB_CLIENT_ID: ${{ secrets.ARGOS_GITHUB_CLIENT_ID }}
          VITE_GITHUB_REDIRECT_URI: ${{ secrets.ARGOS_GITHUB_REDIRECT_URI }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_PROVIDER_DB_URL: ${{ secrets.CDN_PROVIDER_DB_URL }}
          ARGOS_TARGET_OS: darwin
          ARGOS_TARGET_ARCH: ${{ matrix.arch }}

      - name: Verify bundled plugins
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          APP_DIR="dist/mac/Argos.app"
          if [ "$TARGET_ARCH" = "arm64" ]; then
            APP_DIR="dist/mac-arm64/Argos.app"
          fi
          PLUGIN_ROOT="${APP_DIR}/Contents/Resources/app.asar.unpacked/plugins"
          bun run plugin:verify -- --name cua --platform darwin --arch "$TARGET_ARCH" --plugin-root "$PLUGIN_ROOT"

      - name: Verify daemon version
        shell: bash
        run: |
          version="$(apps/daemon/dist/argos-daemon --version)"
          test -n "$version"
          echo "Daemon version: $version"

      - name: Stage daemon binary
        shell: bash
        env:
          DAEMON_OS: ${{ matrix.daemon_os }}
          DAEMON_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/daemon
          ext=""
          [ "$DAEMON_OS" = "windows" ] && ext=".exe"
          cp "apps/daemon/dist/argos-daemon${ext}" "dist/daemon/argos-daemon-${DAEMON_OS}-${DAEMON_ARCH}${ext}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: argos-${{ matrix.platform }}
          retention-days: 7
          path: |
            dist/*
            !dist/mac/*
            !dist/mac-arm64/*
            dist/daemon/**

  release:
    needs:
      - resolve-tag
      - build-windows
      - build-linux
      - build-mac
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.resolve-tag.outputs.sha }}
          fetch-depth: 1

      - name: Get version number
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Error: tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi
          if echo "$VERSION" | grep -qE '-(beta|alpha)\.[0-9]+$'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release notes from CHANGELOG
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          CHANGELOG="CHANGELOG.md"
          if [ ! -f "$CHANGELOG" ]; then
            echo "Error: CHANGELOG.md not found"
            exit 1
          fi
          NORMALIZED_CHANGELOG="$(mktemp)"
          perl -pe 's/\x{FF08}/(/g; s/\x{FF09}/)/g; s/\r$//' "$CHANGELOG" > "$NORMALIZED_CHANGELOG"
          HEADER_REGEX="^##[[:space:]]+v${VERSION}[[:space:]]*\\([0-9]{4}-[0-9]{2}-[0-9]{2}\\)[[:space:]]*$"
          if ! grep -Eq "$HEADER_REGEX" "$NORMALIZED_CHANGELOG"; then
            echo "Error: Changelog entry not found for v${VERSION}"
            exit 1
          fi
          awk -v ver="v${VERSION}" '
            $0 ~ "^##[[:space:]]+" ver "[[:space:]]*\\(" { in_section = 1 }
            in_section && $0 ~ "^##[[:space:]]+" && $0 !~ "^##[[:space:]]+" ver "[[:space:]]*\\(" { exit }
            in_section { print }
          ' "$NORMALIZED_CHANGELOG" > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Error: Release notes are empty for v${VERSION}"
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets

          # Process Windows x64 artifacts
          if [ -d "artifacts/argos-win-x64" ]; then
            cp artifacts/argos-win-x64/*.exe release_assets/ 2>/dev/null || true
            cp artifacts/argos-win-x64/*.msi release_assets/ 2>/dev/null || true
            cp artifacts/argos-win-x64/*.zip release_assets/ 2>/dev/null || true
            cp artifacts/argos-win-x64/*.yml release_assets/ 2>/dev/null || true
            cp artifacts/argos-win-x64/*.blockmap release_assets/ 2>/dev/null || true
          fi

          # Process Windows arm64 artifacts
          if [ -d "artifacts/argos-win-arm64" ]; then
            cp artifacts/argos-win-arm64/*.exe release_assets/ 2>/dev/null || true
            cp artifacts/argos-win-arm64/*.msi release_assets/ 2>/dev/null || true
            cp artifacts/argos-win-arm64/*.zip release_assets/ 2>/dev/null || true
            cp artifacts/argos-win-arm64/*.blockmap release_assets/ 2>/dev/null || true
          fi

          merge_windows_yml() {
            local name="$1"
            local x64="artifacts/argos-win-x64/$name"
            local arm64="artifacts/argos-win-arm64/$name"
            if [ -f "$x64" ] && [ -f "$arm64" ]; then
              ruby -ryaml -e '
                x64 = YAML.load_file(ARGV[0]) || {}
                arm = YAML.load_file(ARGV[1]) || {}
                merged = x64.dup
                merged["version"] ||= arm["version"]
                merged["releaseDate"] ||= arm["releaseDate"]
                merged["releaseNotes"] ||= arm["releaseNotes"]
                merged["path"] ||= arm["path"]
                merged["sha512"] ||= arm["sha512"]
                files = []
                files.concat(x64["files"]) if x64["files"].is_a?(Array)
                files.concat(arm["files"]) if arm["files"].is_a?(Array)
                merged["files"] = files.uniq { |f| f["url"] }
                File.write(ARGV[2], merged.to_yaml)
              ' "$x64" "$arm64" "release_assets/$name"
            elif [ -f "$x64" ]; then
              cp "$x64" "release_assets/$name"
            elif [ -f "$arm64" ]; then
              cp "$arm64" "release_assets/$name"
            fi
          }

          merge_windows_yml latest.yml
          merge_windows_yml beta.yml

          # Process Linux x64 artifacts
          if [ -d "artifacts/argos-linux-x64" ]; then
            cp artifacts/argos-linux-x64/*.AppImage release_assets/ 2>/dev/null || true
            cp artifacts/argos-linux-x64/*.deb release_assets/ 2>/dev/null || true
            cp artifacts/argos-linux-x64/*.rpm release_assets/ 2>/dev/null || true
            cp artifacts/argos-linux-x64/*.tar.gz release_assets/ 2>/dev/null || true
            cp artifacts/argos-linux-x64/*.yml release_assets/ 2>/dev/null || true
            cp artifacts/argos-linux-x64/*.blockmap release_assets/ 2>/dev/null || true
          fi

          # Process Mac x64 artifacts
          if [ -d "artifacts/argos-mac-x64" ]; then
            cp artifacts/argos-mac-x64/*.dmg release_assets/ 2>/dev/null || true
            cp artifacts/argos-mac-x64/*.zip release_assets/ 2>/dev/null || true
            cp artifacts/argos-mac-x64/*.blockmap release_assets/ 2>/dev/null || true
          fi

          # Process Mac arm64 artifacts
          if [ -d "artifacts/argos-mac-arm64" ]; then
            cp artifacts/argos-mac-arm64/*.dmg release_assets/ 2>/dev/null || true
            cp artifacts/argos-mac-arm64/*.zip release_assets/ 2>/dev/null || true
            cp artifacts/argos-mac-arm64/*.blockmap release_assets/ 2>/dev/null || true
          fi

          merge_mac_yml() {
            local name="$1"
            local x64="artifacts/argos-mac-x64/$name"
            local arm64="artifacts/argos-mac-arm64/$name"
            if [ -f "$x64" ] && [ -f "$arm64" ]; then
              ruby -ryaml -e '
                x64 = YAML.load_file(ARGV[0]) || {}
                arm = YAML.load_file(ARGV[1]) || {}
                merged = x64.dup
                merged["version"] ||= arm["version"]
                merged["releaseDate"] ||= arm["releaseDate"]
                merged["releaseNotes"] ||= arm["releaseNotes"]
                merged["path"] ||= arm["path"]
                merged["sha512"] ||= arm["sha512"]
                files = []
                files.concat(x64["files"]) if x64["files"].is_a?(Array)
                files.concat(arm["files"]) if arm["files"].is_a?(Array)
                merged["files"] = files.uniq { |f| f["url"] }
                File.write(ARGV[2], merged.to_yaml)
              ' "$x64" "$arm64" "release_assets/$name"
            elif [ -f "$x64" ]; then
              cp "$x64" "release_assets/$name"
            elif [ -f "$arm64" ]; then
              cp "$arm64" "release_assets/$name"
            fi
          }

          merge_mac_yml latest-mac.yml
          merge_mac_yml beta-mac.yml

          if [ -z "$(ls -A release_assets)" ]; then
            echo "Error: No release assets found"
            exit 1
          fi

          ls -la release_assets/

      - name: Collect daemon binaries and checksums
        run: |
          # Gather the staged daemon binaries from every platform artifact
          mkdir -p release_assets
          cp artifacts/*/daemon/argos-daemon-* release_assets/ 2>/dev/null || true

          daemon_count=$(find release_assets -maxdepth 1 -type f -name 'argos-daemon-*' ! -name '*.sha256' | wc -l)
          if [ "$daemon_count" -eq 0 ]; then
            echo "Error: No daemon binaries were staged by the build jobs." >&2
            exit 1
          fi

          # Emit a portable <hash>  <basename> checksum next to each binary
          for f in release_assets/argos-daemon-*; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            hash=$(sha256sum "$f" | awk '{print $1}')
            base=$(basename "$f")
            echo "$hash  $base" > "$f.sha256"
          done

          echo "Daemon assets:"
          ls -la release_assets/argos-daemon-*

      - name: Create Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: Argos V${{ steps.get_version.outputs.version }}
          draft: true
          prerelease: ${{ steps.get_version.outputs.prerelease == 'true' }}
          files: |
            release_assets/*
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
