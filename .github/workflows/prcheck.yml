name: PR Check

on:
  pull_request:
    branches:
      - main
      - dev

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  TURBO_API: ${{ secrets.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

concurrency:
  group: prcheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  main-release-guard:
    if: github.base_ref == 'main'
    runs-on: ubuntu-22.04
    steps:
      - name: Validate release branch naming
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "${HEAD_REF}" != release/* ]]; then
            echo "PRs targeting main must come from release/<version> branches." >&2
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate release head exists on dev
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin dev --prune
          if ! git merge-base --is-ancestor "${HEAD_SHA}" origin/dev; then
            echo "Release PR head must already exist on origin/dev." >&2
            exit 1
          fi

  build-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: ./.github/actions/setup-build
        with:
          setup-bun: "true"

      - name: lint
        run: pnpm run lint

      - name: format:check
        run: pnpm run format:check

      - name: Typecheck and build affected packages
        run: pnpm turbo run typecheck build --affected --output-logs=new-only
        env:
          VITE_PROVIDER_DB_URL: ${{ secrets.CDN_PROVIDER_DB_URL }}
          ARGOS_TARGET_OS: linux
          ARGOS_TARGET_ARCH: x64

      - name: Daemon unit tests
        run: pnpm turbo run test --filter=@argos/daemon --output-logs=new-only
