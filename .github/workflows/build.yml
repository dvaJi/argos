name: Build Application

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Select build platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - linux
          - mac

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RTK_INSTALL_GITHUB_TOKEN: ${{ secrets.RTK_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
  RTK_INSTALL_GITHUB_TOKEN_SOURCE: ${{ secrets.RTK_GITHUB_TOKEN != '' && 'RTK_GITHUB_TOKEN' || 'GITHUB_TOKEN' }}
  TURBO_API: ${{ secrets.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build

      - name: Build and validate packaging inputs
        run: |
          bun run build
          bun run packaging:validate
        env:
          VITE_GITHUB_CLIENT_ID: ${{ secrets.ARGOS_GITHUB_CLIENT_ID }}
          VITE_GITHUB_REDIRECT_URI: ${{ secrets.ARGOS_GITHUB_REDIRECT_URI }}
          VITE_PROVIDER_DB_URL: ${{ secrets.CDN_PROVIDER_DB_URL }}

  build-windows:
    name: build-windows(${{ matrix.arch }})
    needs: preflight
    if: github.event.inputs.platform == 'all' || contains(github.event.inputs.platform, 'windows')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            platform: win-x64
            runner: windows-2025-vs2026
            unpacked: win-unpacked
          - arch: arm64
            platform: win-arm64
            runner: windows-11-arm
            unpacked: win-arm64-unpacked
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
      - name: Restore Windows runtime cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: runtime
          key: runtime-v2-win32-${{ matrix.arch }}-${{ hashFiles('package.json', 'scripts/**') }}

      - name: Report RTK install token source
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          echo "RTK runtime install token source: ${RTK_INSTALL_GITHUB_TOKEN_SOURCE}"

      - name: Install Windows runtimes
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: bun run installRuntime:win:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ env.RTK_INSTALL_GITHUB_TOKEN }}

      - name: Inspect Windows build toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          node --version
          bun --version
          bun x turbo --version
          bun --version

      - name: Build Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          bun run build
          bun run packaging:validate
          bun run build:daemon
          bun x electron-builder --config apps/desktop/electron-builder.yml --win --${{ matrix.arch }} --publish=never
        env:
          VITE_GITHUB_CLIENT_ID: ${{ secrets.ARGOS_GITHUB_CLIENT_ID }}
          VITE_GITHUB_REDIRECT_URI: ${{ secrets.ARGOS_GITHUB_REDIRECT_URI }}
          VITE_PROVIDER_DB_URL: ${{ secrets.CDN_PROVIDER_DB_URL }}
          ARGOS_TARGET_OS: win32
          ARGOS_TARGET_ARCH: ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: argos-${{ matrix.platform }}
          retention-days: 7
          path: |
            dist/*
            !dist/win-unpacked
            !dist/win-arm64-unpacked

  build-linux:
    needs: preflight
    if: github.event.inputs.platform == 'all' || contains(github.event.inputs.platform, 'linux')
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch: [x64]
        include:
          - arch: x64
            platform: linux-x64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
      - name: Restore Linux runtime cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: runtime
          key: runtime-v2-linux-${{ matrix.arch }}-${{ hashFiles('package.json', 'scripts/**') }}

      - name: Install Linux runtimes
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: bun run installRuntime:linux:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ env.RTK_INSTALL_GITHUB_TOKEN }}

      - name: Build Linux
        run: |
          bun run build
          bun run build:daemon
          bun x electron-builder --config apps/desktop/electron-builder.yml --linux --${{ matrix.arch }} --publish=never
        env:
          VITE_GITHUB_CLIENT_ID: ${{ secrets.ARGOS_GITHUB_CLIENT_ID }}
          VITE_GITHUB_REDIRECT_URI: ${{ secrets.ARGOS_GITHUB_REDIRECT_URI }}
          VITE_PROVIDER_DB_URL: ${{ secrets.CDN_PROVIDER_DB_URL }}
          ARGOS_TARGET_OS: linux
          ARGOS_TARGET_ARCH: ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: argos-${{ matrix.platform }}
          retention-days: 7
          path: |
            dist/*
            !dist/linux-unpacked

  build-mac:
    needs: preflight
    if: false # macOS build temporarily disabled — code signing/notarization not ready
    runs-on: macos-15
    strategy:
      matrix:
        arch: [x64, arm64]
        include:
          - arch: x64
            platform: mac-x64
          - arch: arm64
            platform: mac-arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-build
      - name: Restore macOS runtime cache
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: runtime
          key: runtime-v2-darwin-${{ matrix.arch }}-${{ hashFiles('package.json', 'scripts/**') }}

      - name: Report RTK install token source
        shell: bash
        run: |
          echo "RTK runtime install token source: ${RTK_INSTALL_GITHUB_TOKEN_SOURCE}"

      - name: Install Node Runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: bun run installRuntime:mac:${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ env.RTK_INSTALL_GITHUB_TOKEN }}

      - name: Build Mac
        run: |
          bun run build
          bun run build:daemon
          bun run plugin:cua:build:mac:${{ matrix.arch }}
          bun run plugin:bundle -- --name cua --platform darwin --arch ${{ matrix.arch }}
          bun x electron-builder --config apps/desktop/electron-builder.yml --mac --${{ matrix.arch }} --publish=never
        env:
          CSC_LINK: ${{ secrets.ARGOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.ARGOS_CSC_KEY_PASS }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.ARGOS_CSC_LINK != '' && 'true' || 'false' }}
          ARGOS_APPLE_NOTARY_USERNAME: ${{ secrets.ARGOS_APPLE_NOTARY_USERNAME }}
          ARGOS_APPLE_NOTARY_TEAM_ID: ${{ secrets.ARGOS_APPLE_NOTARY_TEAM_ID }}
          ARGOS_APPLE_NOTARY_PASSWORD: ${{ secrets.ARGOS_APPLE_NOTARY_PASSWORD }}
          # build_for_release: '2'  # Requires Developer ID Application cert for CUA helper signing
          VITE_GITHUB_CLIENT_ID: ${{ secrets.ARGOS_GITHUB_CLIENT_ID }}
          VITE_GITHUB_REDIRECT_URI: ${{ secrets.ARGOS_GITHUB_REDIRECT_URI }}
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_PROVIDER_DB_URL: ${{ secrets.CDN_PROVIDER_DB_URL }}
          ARGOS_TARGET_OS: darwin
          ARGOS_TARGET_ARCH: ${{ matrix.arch }}

      - name: Verify bundled plugins
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          APP_DIR="dist/mac/Argos.app"
          if [ "$TARGET_ARCH" = "arm64" ]; then
            APP_DIR="dist/mac-arm64/Argos.app"
          fi
          PLUGIN_ROOT="${APP_DIR}/Contents/Resources/app.asar.unpacked/plugins"
          bun run plugin:verify -- --name cua --platform darwin --arch "$TARGET_ARCH" --plugin-root "$PLUGIN_ROOT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: argos-${{ matrix.platform }}
          retention-days: 7
          path: |
            dist/*
            !dist/mac/*
            !dist/mac-arm64/*
