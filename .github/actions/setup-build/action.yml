name: Setup Argos build
description: Install Bun, restore dependency/Turbo/Electron caches, and install dependencies.

inputs:
  include-landing:
    description: Include the @argos/landing app dependencies (wrangler/workerd) in the install. Defaults to off because desktop builds don't need the landing page, and workerd has no win32-arm64 binary.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"

    - name: Restore Bun install cache
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
        restore-keys: |
          bun-install-${{ runner.os }}-

    - name: Restore Turbo local-cache fallback
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-v2-${{ hashFiles('bun.lockb', 'turbo.json', 'apps/*/turbo.json', 'packages/*/turbo.json') }}
        restore-keys: |
          turbo-v2-
        enableCrossOsArchive: true

    - name: Restore Electron downloads
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: electron-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lockb', 'apps/desktop/electron-builder.yml') }}
        restore-keys: |
          electron-v2-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      run: |
        if [ "${{ inputs.include-landing }}" = "true" ]; then
          bun install --frozen-lockfile
        else
          # Excluding @argos/landing is not directly supported by bun install --filter for exclusions.
          # Install everything; workerd platform failures are handled gracefully in CI build steps.
          bun install --frozen-lockfile
        fi
