name: Setup Argos build
description: Install Bun, restore dependency/Turbo/Electron caches, and install dependencies.

inputs:
  include-landing:
    description: Include the @argos/landing app dependencies (wrangler/workerd) in the install. Defaults to off because desktop builds don't need the landing page, and workerd has no win32-arm64 binary.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        # Single source of truth: the "packageManager" field (bun@x.y.z).
        bun-version-file: package.json

    - name: Restore Bun install cache
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-install-${{ runner.os }}-

    - name: Restore Turbo local-cache fallback
      uses: actions/cache@v6
      with:
        path: .turbo
        key: turbo-v2-${{ hashFiles('bun.lock', 'turbo.json', 'apps/*/turbo.json', 'packages/*/turbo.json') }}
        restore-keys: |
          turbo-v2-
        enableCrossOsArchive: true

    - name: Restore Electron downloads
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~/AppData/Local/electron/Cache
          ~/AppData/Local/electron-builder/Cache
        key: electron-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'apps/desktop/electron-builder.yml') }}
        restore-keys: |
          electron-v2-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      # TODO(include-landing): bun install has no exclusion filter, so the full
      # workspace is always installed; workerd platform failures are tolerated
      # by the CI build steps. The input is kept for callers' forward compat.
      run: bun install --frozen-lockfile
