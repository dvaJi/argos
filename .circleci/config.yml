# CircleCI configuration for Argos.
#
# Replaces the GitHub Actions build/release pipelines (build.yml, release.yml,
# prcheck.yml). The following stay on GitHub Actions because CircleCI cloud
# cannot run them:
#   - Windows ARM64 builds (no win-arm64 runner)  -> build.yml / release.yml
#   - Windows ARM64 E2E                            -> windows-arm64-e2e.yml
#   - react-doctor (third-party GitHub Action)      -> react-doctor.yml
#
# Required CircleCI context (create under Project Settings > Contexts):
#   Name: argos
#   Env vars:
#     GH_TOKEN                 — GitHub PAT with contents:write (for gh release create)
#     RTK_GITHUB_TOKEN         — token for tiny-runtime-injector downloads (or reuse GH_TOKEN)
#     VITE_GITHUB_CLIENT_ID    — GitHub OAuth client id (public)
#     VITE_GITHUB_REDIRECT_URI — https://argos.aipurrjects.xyz/auth/github/callback
#     VITE_PROVIDER_DB_URL     — CDN provider DB url
#     TURBO_API / TURBO_TEAM / TURBO_TOKEN — remote cache (optional)

version: 2.1

executors:
  linux:
    docker:
      - image: cimg/node:24.14.1
    resource_class: large
  windows:
    machine:
      image: windows-server-2022-gui:current
    shell: bash.exe
    resource_class: windows.large

# ---------------------------------------------------------------------------
# Reusable commands
# ---------------------------------------------------------------------------

commands:
  install-linux-deps:
    description: "Install system libraries required by electron-builder on Linux."
    steps:
      - run:
          name: Install electron-builder system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
              libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
              libgbm1 libpango-1.0-0 libcairo2 fakeroot dpkg rpm
            # Package renamed to libasound2t64 on Ubuntu 24.04
            sudo apt-get install -y libasound2 || sudo apt-get install -y libasound2t64 || true

  setup-pnpm-linux:
    description: "Enable pnpm via corepack on Linux."
    steps:
      - run:
          name: Enable pnpm
          command: |
            corepack enable
            corepack prepare pnpm@10.33.4 --activate
            pnpm --version

  setup-node-pnpm-windows:
    description: "Install Node 24 + pnpm on the Windows machine executor."
    steps:
      - run:
          name: Install Node + pnpm (Windows)
          shell: bash.exe
          command: |
            nvm install 24.14.1
            nvm use 24.14.1
            node --version
            corepack enable
            corepack prepare pnpm@10.33.4 --activate
            pnpm --version

  restore-pnpm-store:
    description: "Restore the pnpm store from cache."
    steps:
      - restore_cache:
          name: Restore pnpm store
          keys:
            - pnpm-store-{{ .Environment.CIRCLE_JOB }}-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-store-{{ .Environment.CIRCLE_JOB }}-

  install-deps:
    description: "pnpm install (landing excluded for desktop builds by default)."
    parameters:
      include-landing:
        type: boolean
        default: false
    steps:
      - when:
          condition: << parameters.include-landing >>
          steps:
            - run:
                name: pnpm install (all)
                command: pnpm install --frozen-lockfile
      - unless:
          condition: << parameters.include-landing >>
          steps:
            - run:
                name: pnpm install (exclude landing)
                command: pnpm install --frozen-lockfile --filter "!@argos/landing"
      - save_cache:
          name: Save pnpm store
          key: pnpm-store-{{ .Environment.CIRCLE_JOB }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store

  setup-bun-linux:
    description: "Install Bun for daemon compilation (Linux)."
    steps:
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export BUN_INSTALL="$HOME/.bun"' >> "$BASH_ENV"
            echo 'export PATH="$BUN_INSTALL/bin:$PATH"' >> "$BASH_ENV"

  setup-bun-windows:
    description: "Install Bun for daemon compilation (Windows)."
    steps:
      - run:
          name: Install Bun (Windows)
          shell: powershell.exe -NoProfile
          environment:
            BUN_VERSION: "1.3.14"
          command: irm bun.sh/install.ps1 | iex

  restore-runtime:
    description: "Restore bundled runtimes (Node/uv/ripgrep/rtk) cache."
    parameters:
      key-suffix:
        type: string
        default: ""
    steps:
      - restore_cache:
          name: Restore runtime cache
          keys:
            - argos-runtime-v2-<< parameters.key-suffix >>-{{ checksum "package.json" }}-{{ checksum "scripts/rebuild-native.mjs" }}
            - argos-runtime-v2-<< parameters.key-suffix >>-

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------

jobs:
  lint-and-typecheck:
    executor: linux
    steps:
      - checkout
      - setup-pnpm-linux
      - restore-pnpm-store
      - install-deps
      - run:
          name: Lint
          command: pnpm run lint
      - run:
          name: Format check
          command: pnpm run format:check
      - run:
          name: Typecheck + build (turbo)
          command: pnpm turbo run typecheck build --output-logs=new-only
          environment:
            ARGOS_TARGET_OS: linux
            ARGOS_TARGET_ARCH: x64

  preflight:
    executor: linux
    steps:
      - checkout
      - install-linux-deps
      - setup-pnpm-linux
      - setup-bun-linux
      - restore-pnpm-store
      - install-deps
      - run:
          name: Build + validate packaging inputs
          command: |
            pnpm run build
            pnpm run packaging:validate

  build-windows:
    executor: windows
    environment:
      ARGOS_TARGET_OS: win32
      ARGOS_TARGET_ARCH: x64
    steps:
      - checkout
      - setup-node-pnpm-windows
      - setup-bun-windows
      - restore-pnpm-store
      - install-deps
      - restore-runtime:
          key-suffix: "win32-x64"
      - run:
          name: Install Windows runtimes
          shell: bash.exe
          command: |
            if [ ! -d runtime/node ]; then
              pnpm run installRuntime:win:x64
            fi
      - save_cache:
          name: Save runtime cache
          key: argos-runtime-v2-win32-x64-{{ checksum "package.json" }}-{{ checksum "scripts/rebuild-native.mjs" }}
          paths:
            - runtime
      - run:
          name: Build Windows x64
          shell: bash.exe
          no_output_timeout: 30m
          command: |
            pnpm run build
            pnpm run build:daemon
            pnpm run plugin:bundle -- --name feishu --platform win32 --arch x64
            pnpm exec electron-builder --config apps/desktop/electron-builder.yml --win --x64 --publish=never
      - run:
          name: Verify bundled plugins
          shell: bash.exe
          command: |
            pnpm run plugin:verify -- --name feishu --platform win32 --arch x64 --plugin-root dist/win-unpacked/resources/app.asar.unpacked/plugins
      - run:
          name: Stage artifacts
          shell: bash.exe
          command: |
            mkdir -p /tmp/win-artifacts
            cp -r dist/* /tmp/win-artifacts/ 2>/dev/null || true
            rm -rf /tmp/win-artifacts/win-unpacked 2>/dev/null || true
      - persist_to_workspace:
          root: /tmp
          paths:
            - win-artifacts
      - store_artifacts:
          path: /tmp/win-artifacts
          destination: win-x64

  build-linux:
    executor: linux
    environment:
      ARGOS_TARGET_OS: linux
      ARGOS_TARGET_ARCH: x64
    steps:
      - checkout
      - install-linux-deps
      - setup-pnpm-linux
      - setup-bun-linux
      - restore-pnpm-store
      - install-deps
      - restore-runtime:
          key-suffix: "linux-x64"
      - run:
          name: Install Linux runtimes
          command: |
            if [ ! -d runtime/node ]; then
              pnpm run installRuntime:linux:x64
            fi
      - save_cache:
          name: Save runtime cache
          key: argos-runtime-v2-linux-x64-{{ checksum "package.json" }}-{{ checksum "scripts/rebuild-native.mjs" }}
          paths:
            - runtime
      - run:
          name: Build Linux x64
          no_output_timeout: 30m
          command: |
            pnpm run build
            pnpm run build:daemon
            pnpm run plugin:bundle -- --name feishu --platform linux --arch x64
            pnpm exec electron-builder --config apps/desktop/electron-builder.yml --linux --x64 --publish=never
      - run:
          name: Verify bundled plugins
          command: |
            pnpm run plugin:verify -- --name feishu --platform linux --arch x64 --plugin-root dist/linux-unpacked/resources/app.asar.unpacked/plugins
      - run:
          name: Stage artifacts
          command: |
            mkdir -p /tmp/linux-artifacts
            cp -r dist/* /tmp/linux-artifacts/ 2>/dev/null || true
            rm -rf /tmp/linux-artifacts/linux-unpacked 2>/dev/null || true
      - persist_to_workspace:
          root: /tmp
          paths:
            - linux-artifacts
      - store_artifacts:
          path: /tmp/linux-artifacts
          destination: linux-x64

  release:
    executor: linux
    steps:
      - checkout
      - run:
          name: Install GitHub CLI
          command: |
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update
            sudo apt-get install -y gh
            gh --version
      - run:
          name: Validate tag matches package version
          command: |
            VERSION=$(node -p "require('./package.json').version")
            TAG="${CIRCLE_TAG}"
            if [ "v$VERSION" != "$TAG" ]; then
              echo "Error: tag $TAG does not match package.json version v$VERSION"
              exit 1
            fi
            echo "export IS_PRERELEASE=$(if echo "$VERSION" | grep -qE '-(beta|alpha)\.[0-9]+$'; then echo true; else echo false; fi)" >> "$BASH_ENV"
      - run:
          name: Build release notes from CHANGELOG
          command: |
            VERSION="${CIRCLE_TAG#v}"
            HEADER_REGEX="^##[[:space:]]+v${VERSION}[[:space:]]*\\([0-9]{4}-[0-9]{2}-[0-9]{2}\\)[[:space:]]*$"
            if ! grep -Eq "$HEADER_REGEX" CHANGELOG.md; then
              echo "Error: Changelog entry not found for v${VERSION}"
              exit 1
            fi
            awk -v ver="v${VERSION}" '
              $0 ~ "^##[[:space:]]+" ver "[[:space:]]*\\(" { in_section = 1 }
              in_section && $0 ~ "^##[[:space:]]+" && $0 !~ "^##[[:space:]]+" ver "[[:space:]]*\\(" { exit }
              in_section { print }
            ' CHANGELOG.md > release_notes.md
      - attach_workspace:
          at: /tmp/artifacts
      - run:
          name: Prepare release assets
          command: |
            mkdir -p release_assets
            for dir in /tmp/artifacts/win-artifacts /tmp/artifacts/linux-artifacts; do
              if [ -d "$dir" ]; then
                cp "$dir"/*.exe release_assets/ 2>/dev/null || true
                cp "$dir"/*.msi release_assets/ 2>/dev/null || true
                cp "$dir"/*.zip release_assets/ 2>/dev/null || true
                cp "$dir"/*.AppImage release_assets/ 2>/dev/null || true
                cp "$dir"/*.deb release_assets/ 2>/dev/null || true
                cp "$dir"/*.rpm release_assets/ 2>/dev/null || true
                cp "$dir"/*.tar.gz release_assets/ 2>/dev/null || true
                cp "$dir"/*.yml release_assets/ 2>/dev/null || true
                cp "$dir"/*.blockmap release_assets/ 2>/dev/null || true
              fi
            done
            if [ -z "$(ls -A release_assets)" ]; then
              echo "Error: No release assets found"
              exit 1
            fi
            ls -la release_assets/
      - run:
          name: Create GitHub Release
          command: |
            PRERELEASE_FLAG=""
            if [ "$IS_PRERELEASE" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "${CIRCLE_TAG}" \
              --title "Argos V${CIRCLE_TAG#v}" \
              --notes-file release_notes.md \
              --draft \
              $PRERELEASE_FLAG \
              release_assets/*

# ---------------------------------------------------------------------------
# Workflows
# ---------------------------------------------------------------------------

workflows:
  # Runs on every push/PR branch — lint, format, typecheck, build.
  continuous-integration:
    jobs:
      - lint-and-typecheck:
          context: argos
          filters:
            tags:
              ignore: /.*/

  # Runs only on version tags (v*.*.*) — full release pipeline.
  # win-arm64 is NOT included (no CircleCI win-arm64 runner); it stays on GitHub Actions.
  release:
    jobs:
      - preflight:
          context: argos
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+.*/
            branches:
              ignore: /.*/
      - build-windows:
          context: argos
          requires:
            - preflight
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+.*/
            branches:
              ignore: /.*/
      - build-linux:
          context: argos
          requires:
            - preflight
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+.*/
            branches:
              ignore: /.*/
      - release:
          context: argos
          requires:
            - build-windows
            - build-linux
          filters:
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+.*/
            branches:
              ignore: /.*/
